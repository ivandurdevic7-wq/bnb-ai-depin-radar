name: Otkrij nove BNB AI DePIN kandidate
on:
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bnb-radar-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: DexScreener and GoPlus screening (no trading)
        run: python scripts/discover_candidates.py
      - name: Commit unverified candidates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/candidates.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh BNB discovery candidates'
            git pull --rebase origin main
            git push origin main
          fi
