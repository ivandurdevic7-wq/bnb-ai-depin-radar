name: Otkrij nove BNB AI DePIN kandidate
on:
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/discover_candidates.py'
      - 'scripts/test_discovery.py'
      - '.github/workflows/discover-candidates.yml'
permissions:
  contents: write
concurrency:
  group: bnb-radar-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline risk and API regression tests
        run: python -m unittest discover -s scripts -p 'test_discovery.py' -v
      - name: DexScreener and GoPlus screening (no trading)
        run: python scripts/discover_candidates.py
      - name: Commit unverified candidates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Refresh the working copy first; a previous scan may have updated the same JSON.
          git fetch origin main
          git add data/candidates.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh BNB discovery candidates'
            if ! git pull --rebase origin main; then
              # Never force-push a conflicted or stale discovery file.
              git rebase --abort || true
              git reset --hard origin/main
              python scripts/discover_candidates.py
              git add data/candidates.json
              if ! git diff --cached --quiet; then
                git commit -m 'Refresh BNB discovery candidates after conflict'
              fi
            fi
            git push origin main
          fi
